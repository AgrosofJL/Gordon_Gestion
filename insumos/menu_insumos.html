<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gordon Gestión · Menú Insumos</title>
<style>
  :root {
    --color-bg: #F5F4F1;
    --color-surface: #FFFFFF;
    --color-text: #211C16;
    --color-text-secondary: #6B6255;
    --color-accent: #B45309;
    --color-accent-dark: #7C3809;
    --color-accent-soft: rgba(180, 83, 9, 0.10);
    --color-border: rgba(33, 28, 22, 0.10);
    --radius-lg: 20px;
    --radius-md: 12px;
    --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    font-family: var(--font-family);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
  }

  .barra-superior {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 44px;
    background-color: rgba(255, 255, 255, 0.78);
    background-image: repeating-linear-gradient(
      100deg,
      rgba(180, 83, 9, 0.035) 0px,
      rgba(180, 83, 9, 0.035) 1.5px,
      transparent 1.5px,
      transparent 38px
    );
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .btn-volver {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--color-border);
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-volver:hover {
    background: var(--color-accent-soft);
    color: var(--color-accent-dark);
    border-color: var(--color-accent);
  }

  .btn-volver:active {
    transform: scale(0.97);
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
  }

  .usuario-actual { display: flex; align-items: center; gap: 12px; }
  .datos-usuario { line-height: 1.3; text-align: right; }
  .datos-usuario .nombre { font-size: 13.5px; font-weight: 600; }
  .rol-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--color-accent-dark);
    background: var(--color-accent-soft);
    padding: 1px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .contenido {
    padding: 40px 44px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .cabecera-seccion h1 {
    font-size: 27px;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
    color: var(--color-accent-dark);
  }
  .cabecera-seccion p { margin: 0; color: var(--color-text-secondary); font-size: 14.5px; }

  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 34px;
  }

  .card-submodulo {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 30px 24px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    box-shadow: 0 1px 2px rgba(20, 30, 24, 0.04);
    opacity: 0;
    animation: entrar 0.45s ease forwards;
    font-family: inherit;
    color: inherit;
    display: block;
    width: 100%;
    position: relative;
  }

  @keyframes entrar {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-submodulo:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(180, 83, 9, 0.12);
    border-color: var(--color-accent);
  }

  .icono-submodulo {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: var(--color-accent-soft);
    color: var(--color-accent-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .card-submodulo h3 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
  .card-submodulo p { margin: 0; font-size: 13.5px; color: var(--color-text-secondary); line-height: 1.4; }

  @media (max-width: 640px) {
    .barra-superior, .contenido { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

  <div class="barra-superior">
    <button class="btn-volver" id="btnVolver">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Menú Principal
    </button>

    <div class="usuario-actual">
      <div class="datos-usuario">
        <div class="nombre" id="nombreUsuario">—</div>
        <span class="rol-badge" id="rolUsuario">—</span>
      </div>
    </div>
  </div>

  <div class="contenido">
    <div class="cabecera-seccion">
      <h1>Insumos</h1>
      <p>Catálogo, consumos, ingresos y control de stock de la bodega.</p>
    </div>

    <div class="grid-cards" id="gridSubmodulos"></div>
  </div>

<script>
(function () {
  // Mismo patrón de sesión que el resto de los menús de submódulo (campo, etc.)
  const electronDisponible = typeof require === 'function';
  let auth = null;
  if (electronDisponible) {
    try {
      auth = require('../auth.js'); // Subimos un nivel de carpeta para buscar auth.js
    } catch (e) {
      console.warn('No se pudo cargar auth.js:', e.message);
    }
  }

  // Un ícono SVG por cada submódulo de Insumos
  const ICONOS = {
    catalogo: '<path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L4 3a1 1 0 0 0-1 1l.24 5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.82z"/><circle cx="8.5" cy="8.5" r="1.5"/>',
    consumos: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
    ingresos: '<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/>',
    stock: '<path d="M21 8V7a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7v10a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 17v-1"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>'
  };

  function svgIcono(nombre) {
    return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS[nombre]}</svg>`;
  }

  // Las 4 pantallas del módulo de Insumos
  const SUBMODULOS = [
    { key: 'catalogo', titulo: 'Catálogo', descripcion: 'Artículos, rubros y sub-rubros habilitados en bodega.', icono: 'catalogo' },
    { key: 'ingresos', titulo: 'Ingresos', descripcion: 'Compras y recepciones de mercadería de proveedores.', icono: 'ingresos' },
    { key: 'consumos', titulo: 'Consumos', descripcion: 'Salidas de insumos aplicadas a labores y campo.', icono: 'consumos' },
    { key: 'stock', titulo: 'Stock', descripcion: 'Existencias netas por depósito y alertas de vencimiento.', icono: 'stock' }
  ];

  function abrirSubmodulo(key) {
    if (electronDisponible) {
      window.location.href = `${key}.html`; // Todas las pantallas viven en la misma carpeta insumos/
    } else {
      alert('Abriendo submódulo en vista previa: ' + key);
    }
  }

  function renderizar(sesion) {
    document.getElementById('nombreUsuario').textContent = sesion.nombre_completo || sesion.usuario;
    document.getElementById('rolUsuario').textContent = sesion.rol === 'admin' ? 'Administrador' : sesion.rol || 'Operario';

    const grid = document.getElementById('gridSubmodulos');
    grid.innerHTML = SUBMODULOS
      .map(
        (sm, i) => `
      <button type="button" class="card-submodulo" style="animation-delay:${i * 0.05}s" data-key="${sm.key}">
        <div class="icono-submodulo">${svgIcono(sm.icono)}</div>
        <h3>${sm.titulo}</h3>
        <p>${sm.descripcion}</p>
      </button>
    `
      )
      .join('');

    grid.querySelectorAll('.card-submodulo').forEach((el) => {
      el.addEventListener('click', () => abrirSubmodulo(el.dataset.key));
    });
  }

  // Obtener sesión activa (mismo esquema que menu_campo.html)
  let sesion = null;
  if (auth) {
    sesion = auth.obtenerSesionActiva();
    if (!sesion) {
      window.location.href = '../login.html';
      return;
    }
  } else {
    // Modo depuración visual fuera de Electron
    sesion = { nombre_completo: 'Juanchi Dev', rol: 'admin' };
  }

  document.getElementById('btnVolver').addEventListener('click', () => {
    window.location.href = '../menu_central.html';
  });

  renderizar(sesion);
})();
</script>
</body>
</html>
