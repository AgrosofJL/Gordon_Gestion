<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gordon Gestión · Menú Personal</title>
<style>
  :root {
    --color-bg: #F4F5F8;
    --color-surface: #FFFFFF;
    --color-text: #1A1E29;
    --color-text-secondary: #5B6172;
    --color-accent: #3949AB;
    --color-accent-dark: #26327A;
    --color-accent-soft: rgba(57, 73, 171, 0.10);
    --color-border: rgba(26, 30, 41, 0.10);
    --radius-lg: 20px;
    --radius-md: 12px;
    --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    font-family: var(--font-family);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
  }

  .barra-superior {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 44px;
    background-color: rgba(255, 255, 255, 0.78);
    background-image: repeating-linear-gradient(
      100deg,
      rgba(57, 73, 171, 0.035) 0px,
      rgba(57, 73, 171, 0.035) 1.5px,
      transparent 1.5px,
      transparent 38px
    );
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .btn-volver {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--color-border);
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-volver:hover {
    background: var(--color-accent-soft);
    color: var(--color-accent-dark);
    border-color: var(--color-accent);
  }

  .btn-volver:active {
    transform: scale(0.97);
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
  }

  .usuario-actual { display: flex; align-items: center; gap: 12px; }
  .datos-usuario { line-height: 1.3; text-align: right; }
  .datos-usuario .nombre { font-size: 13.5px; font-weight: 600; }
  .rol-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--color-accent-dark);
    background: var(--color-accent-soft);
    padding: 1px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .contenido {
    padding: 40px 44px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .cabecera-seccion h1 {
    font-size: 27px;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
    color: var(--color-accent-dark);
  }
  .cabecera-seccion p { margin: 0; color: var(--color-text-secondary); font-size: 14.5px; }

  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 34px;
  }

  .card-submodulo {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 30px 24px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    box-shadow: 0 1px 2px rgba(20, 30, 24, 0.04);
    opacity: 0;
    animation: entrar 0.45s ease forwards;
    font-family: inherit;
    color: inherit;
    display: block;
    width: 100%;
    position: relative;
  }

  @keyframes entrar {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-submodulo:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(57, 73, 171, 0.12);
    border-color: var(--color-accent);
  }

  .icono-submodulo {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: var(--color-accent-soft);
    color: var(--color-accent-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .card-submodulo h3 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
  .card-submodulo p { margin: 0; font-size: 13.5px; color: var(--color-text-secondary); line-height: 1.4; }

  @media (max-width: 640px) {
    .barra-superior, .contenido { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

  <div class="barra-superior">
    <button class="btn-volver" id="btnVolver">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Menú Principal
    </button>

    <div class="usuario-actual">
      <div class="datos-usuario">
        <div class="nombre" id="nombreUsuario">—</div>
        <span class="rol-badge" id="rolUsuario">—</span>
      </div>
    </div>
  </div>

  <div class="contenido">
    <div class="cabecera-seccion">
      <h1>Personal</h1>
      <p>Legajos, historial laboral y valorización de la nómina.</p>
    </div>

    <div class="grid-cards" id="gridSubmodulos"></div>
  </div>

<script>
(function () {
  // Mismo patrón de sesión que el resto de los menús de submódulo (campo, insumos, etc.)
  const electronDisponible = typeof require === 'function';
  let auth = null;
  if (electronDisponible) {
    try {
      auth = require('../auth.js'); // Subimos un nivel de carpeta para buscar auth.js
    } catch (e) {
      console.warn('No se pudo cargar auth.js:', e.message);
    }
  }

  const ICONOS = {
    nomina: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
  };

  function svgIcono(nombre) {
    return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS[nombre]}</svg>`;
  }

  // Por ahora Personal tiene una sola pantalla (Nómina y Legajos), pero se
  // deja como grilla de tarjetas -igual que Campo/Insumos/Empaque- para que
  // sea fácil sumar después Liquidaciones, Asistencia, etc. sin reordenar nada.
  const SUBMODULOS = [
    { key: 'nomina', titulo: 'Nómina y Legajos', descripcion: 'Personal activo, historial laboral, valorización de legajos y altas/bajas.', icono: 'nomina' }
  ];

  function abrirSubmodulo(key) {
    if (electronDisponible) {
      window.location.href = `${key}.html`; // Todas las pantallas viven en la misma carpeta personal/
    } else {
      alert('Abriendo submódulo en vista previa: ' + key);
    }
  }

  function renderizar(sesion) {
    document.getElementById('nombreUsuario').textContent = sesion.nombre_completo || sesion.usuario;
    document.getElementById('rolUsuario').textContent = sesion.rol === 'admin' ? 'Administrador' : sesion.rol || 'Operario';

    const grid = document.getElementById('gridSubmodulos');
    grid.innerHTML = SUBMODULOS
      .map(
        (sm, i) => `
      <button type="button" class="card-submodulo" style="animation-delay:${i * 0.05}s" data-key="${sm.key}">
        <div class="icono-submodulo">${svgIcono(sm.icono)}</div>
        <h3>${sm.titulo}</h3>
        <p>${sm.descripcion}</p>
      </button>
    `
      )
      .join('');

    grid.querySelectorAll('.card-submodulo').forEach((el) => {
      el.addEventListener('click', () => abrirSubmodulo(el.dataset.key));
    });
  }

  // Obtener sesión activa (mismo esquema que menu_insumos.html)
  let sesion = null;
  if (auth) {
    sesion = auth.obtenerSesionActiva();
    if (!sesion) {
      window.location.href = '../index.html';
      return;
    }
  } else {
    // Modo depuración visual fuera de Electron
    sesion = { nombre_completo: 'Juanchi Dev', rol: 'admin' };
  }

  document.getElementById('btnVolver').addEventListener('click', () => {
    window.location.href = '../menu_central.html';
  });

  renderizar(sesion);
})();
</script>
</body>
</html>
