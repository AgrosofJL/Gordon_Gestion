<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Ícono para pestaña normal del navegador -->
<link rel="icon" type="image/png" href="../logo.png">
<!-- Alternativa con el .ico: <link rel="shortcut icon" href="../icono.ico"> -->

<!-- Ícono oficial para Safari (Agregar a pantalla de inicio en iPhone/iPad/Mac) -->
<link rel="apple-touch-icon" href="../logo.png">

<!-- Metas para que Safari lo abra como App nativa en pantalla completa -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gordon Gestión">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gordon Gestión · Menú Empaque</title>
<style>
  :root {
    --color-bg: #F5F4F1;
    --color-surface: #FFFFFF;
    --color-text: #211C16;
    --color-text-secondary: #6B6255;
    --color-accent: #B45309;
    --color-accent-dark: #7C3809;
    --color-accent-soft: rgba(180, 83, 9, 0.10);
    --color-border: rgba(33, 28, 22, 0.10);
    --radius-lg: 20px;
    --radius-md: 12px;
    --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    font-family: var(--font-family);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
  }

  .barra-superior {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 44px;
    background-color: rgba(255, 255, 255, 0.78);
    background-image: repeating-linear-gradient(
      100deg,
      rgba(180, 83, 9, 0.035) 0px,
      rgba(180, 83, 9, 0.035) 1.5px,
      transparent 1.5px,
      transparent 38px
    );
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .btn-volver {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--color-border);
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-volver:hover {
    background: var(--color-accent-soft);
    color: var(--color-accent-dark);
    border-color: var(--color-accent);
  }

  .btn-volver:active {
    transform: scale(0.97);
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
  }

  .usuario-actual { display: flex; align-items: center; gap: 12px; }
  .datos-usuario { line-height: 1.3; text-align: right; }
  .datos-usuario .nombre { font-size: 13.5px; font-weight: 600; }
  .rol-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--color-accent-dark);
    background: var(--color-accent-soft);
    padding: 1px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .contenido {
    padding: 40px 44px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .cabecera-seccion h1 {
    font-size: 27px;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
    color: var(--color-accent-dark);
  }
  .cabecera-seccion p { margin: 0; color: var(--color-text-secondary); font-size: 14.5px; }

  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 34px;
  }

  .card-submodulo {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 30px 24px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    box-shadow: 0 1px 2px rgba(20, 30, 24, 0.04);
    opacity: 0;
    animation: entrar 0.45s ease forwards;
    font-family: inherit;
    color: inherit;
    display: block;
    width: 100%;
    position: relative;
  }

  @keyframes entrar {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-submodulo:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(180, 83, 9, 0.12);
    border-color: var(--color-accent);
  }

  .icono-submodulo {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: var(--color-accent-soft);
    color: var(--color-accent-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .card-submodulo h3 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
  .card-submodulo p { margin: 0; font-size: 13.5px; color: var(--color-text-secondary); line-height: 1.4; }

  @media (max-width: 640px) {
    .barra-superior, .contenido { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

  <div class="barra-superior">
    <button class="btn-volver" id="btnVolver">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Menú Principal
    </button>

    <div class="usuario-actual">
      <div class="datos-usuario">
        <div class="nombre" id="nombreUsuario">—</div>
        <span class="rol-badge" id="rolUsuario">—</span>
      </div>
    </div>
  </div>

  <div class="contenido">
    <div class="cabecera-seccion">
      <h1>Empaque</h1>
      <p>Recepción, volcado, producción, despachos, stock y balance de volumen de masa.</p>
    </div>

    <div class="grid-cards" id="gridSubmodulos"></div>
  </div>

<script>
(function () {
  const electronDisponible = typeof require === 'function';
  let auth = null;
  if (electronDisponible) {
    try {
      auth = require('../auth.js');
    } catch (e) {
      console.warn('No se pudo cargar auth.js:', e.message);
    }
  }

  /* ESTO LO MODIFIQUE: Agregado ícono e ítem para 'volumen' */
  const ICONOS = {
    recepcion: '<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/>',
    volcado: '<path d="M3 6h18"/><path d="M5 6v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/><path d="M9 10v6M15 10v6"/>',
    produccion: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 3"/>',
    despachos: '<path d="M3 8 12 4l9 4-9 4-9-4Z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/>',
    stock: '<path d="M21 8V7a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7v10a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 17v-1"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    volumen: '<path d="M22 12A10 10 0 0 0 12 2v10z"/><path d="M12 22A10 10 0 0 0 22 12H12z"/><path d="M12 12 2.1 10a10 10 0 0 0 9.9 12z"/><path d="M2.1 10A10 10 0 0 1 12 2v10z"/>'
  };

  function svgIcono(nombre) {
    return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS[nombre]}</svg>`;
  }

  /* ACA ES LO NUEVO: Submódulo Volumen de Masa incorporado al arreglo */
  const SUBMODULOS = [
    { key: 'recepcion', titulo: 'Resumen de Recepción', descripcion: 'Fruta recibida de campo, por lote y productor.', icono: 'recepcion', archivo: 'recepcion' },
    { key: 'volcado', titulo: 'Resumen de Volcado', descripcion: 'Volcado de bins a línea de proceso.', icono: 'volcado', archivo: 'volcado' },
    { key: 'produccion', titulo: 'Resumen de Producción', descripcion: 'Rendimiento y salida de producto terminado.', icono: 'produccion', archivo: 'produccion' },
    { key: 'despachos', titulo: 'Despachos', descripcion: 'Salida de pallets y mercadería embalada.', icono: 'despachos', archivo: 'despachos' },
    { key: 'stock', titulo: 'Stock', descripcion: 'Existencias de pallets y de playa en planta.', icono: 'stock', archivo: 'stock' },
    { key: 'volumen', titulo: 'Volumen de Masa', descripcion: 'Balance general de Cosecha, Producción y Descarte.', icono: 'volumen', archivo: 'volumen' }
  ];

  function abrirSubmodulo(key) {
    if (electronDisponible) {
      window.location.href = `${key}.html`;
    } else {
      alert('Abriendo submódulo en vista previa: ' + key);
    }
  }

  function renderizar(sesion) {
    document.getElementById('nombreUsuario').textContent = sesion.nombre_completo || sesion.usuario;
    document.getElementById('rolUsuario').textContent = sesion.rol === 'admin' ? 'Administrador' : sesion.rol || 'Operario';

    const grid = document.getElementById('gridSubmodulos');
    grid.innerHTML = SUBMODULOS
      .map(
        (sm, i) => `
      <button type="button" class="card-submodulo" style="animation-delay:${i * 0.05}s" data-archivo="${sm.archivo}">
        <div class="icono-submodulo">${svgIcono(sm.icono)}</div>
        <h3>${sm.titulo}</h3>
        <p>${sm.descripcion}</p>
      </button>
    `
      )
      .join('');

    grid.querySelectorAll('.card-submodulo').forEach((el) => {
      el.addEventListener('click', () => abrirSubmodulo(el.dataset.archivo));
    });
  }

  let sesion = null;
  if (auth) {
    sesion = auth.obtenerSesionActiva();
    if (!sesion) {
      window.location.href = '../login.html';
      return;
    }
  } else {
    sesion = { nombre_completo: 'Juanchi Dev', rol: 'admin' };
  }

  document.getElementById('btnVolver').addEventListener('click', () => {
    window.location.href = '../menu_central.html';
  });

  renderizar(sesion);
})();
</script>
</body>
</html>
