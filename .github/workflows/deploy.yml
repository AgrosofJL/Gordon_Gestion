name: Deploy PWA a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# OBLIGATORIO: Permisos explícitos para crear y finalizar artefactos de Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar archivos web
        uses: actions/upload-pages-artifact@v3
        with:
          # Si tus HTML están en la raíz pon '.'
          # Si están en la carpeta public pon './public'
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4