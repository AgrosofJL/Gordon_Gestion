    const bodyPrev = document.getElementById('bodyPreviewMarcos');
    const resumenPrev = document.getElementById('resumenPreviewMarcos');

    // ACA ES LO NUEVO: Función de auto-cálculo de superficie
    function calcularSuperficieAutomatica() {
      const desde = parseInt(inpDesde.value) || 0;
      const hasta = parseInt(inpHasta.value) || 0;
      const mtrs = parseFloat(inpMtrs.value) || 100;
      if (desde > 0 && hasta >= desde) {
        const cantFilas = (hasta - desde) + 1;
        const supCalc = (cantFilas * mtrs * 1.60) / 10000;
        inpSup.value = supCalc.toFixed(4);
      }
    }

    function refrescarPreviewMarcos() {
      calcularSuperficieAutomatica();
      const nombre = inpNombre.value.trim().toUpperCase();
      const supTotal = parseFloat(inpSup.value) || 0;
      const desde = parseInt(inpDesde.value);
      const hasta = parseInt(inpHasta.value);

      if (!nombre) {
        bodyPrev.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--color-text-secondary); padding:10px;">Escriba el nombre del cuadro...</td></tr>`;
        resumenPrev.textContent = '';
        return;
      }
      const supMarco = supTotal / 4;
      bodyPrev.innerHTML = construirMarcosValle(nombre).map(c => `
        <tr>
          <td style="font-weight:700; color:var(--color-accent-dark);">${escapeHtml(c.cuadro)}</td>
          <td>${escapeHtml(c.valvula_riego)}</td>
          <td>${escapeHtml(c.orientacion)}</td>
          <td>${supMarco.toFixed(4)} ha</td>
          <td style="color:#1B5E20; font-weight:600;">${escapeHtml(c.cuadro_inventario)}</td>
        </tr>
      `).join('');

      if (isNaN(desde) || isNaN(hasta) || desde < 1 || desde > hasta) {
        resumenPrev.innerHTML = `<span style="color:#C62828;">Rango de filas inválido</span>`;
        return;
      }
      const cantFilas = (hasta - desde) + 1;
      resumenPrev.textContent = `Se generarán 4 marcos y ${cantFilas} filas × 4 = ${cantFilas * 4} registros (${(supMarco / cantFilas).toFixed(5)} ha por fila). Superficie Total: ${supTotal.toFixed(3)} ha`;
    }

    [inpNombre, inpDesde, inpHasta, inpMtrs].forEach(el => el.addEventListener('input', refrescarPreviewMarcos));
    refrescarPreviewMarcos();
  };

    let cuadros = [];
    if (db) {
      try {

          </select>
        </div>
        <div class="modal-group">
          <label for="masivoVariedad">Variedad *</label>
          <select id="masivoVariedad" class="modal-select" disabled><option value="">-- Elija un cultivo --</option></select>

      </div>

      <div class="modal-row-grid">
        <div class="modal-group">
          <label for="masivoFecha">Fecha de Siembra *</label>
          <input type="date" id="masivoFecha" class="modal-input" value="${hoyStr}" />
        </div>
        <div class="modal-group">
          <label for="masivoCiclo">Ciclo Productivo</label>
          <select id="masivoCiclo" class="modal-select">
            <option value="1">Ciclo 1</option>
            <option value="2">Ciclo 2</option>
            <option value="3" selected>Ciclo 3</option>
            <option value="4">Ciclo 4</option>
          </select>
        </div>
      </div>

      <div class="modal-row-grid">
        <div class="modal-group">
          <label for="masivoSemillas">Semillas por Metro</label>
          <input type="number" id="masivoSemillas" class="modal-input" min="0" value="12" />
        </div>
        <div class="modal-group">
          <label for="masivoMtrs">Largo de Surco (m)</label>
          <input type="number" id="masivoMtrs" class="modal-input" min="1" value="100" />
        </div>
      </div>

      <div class="contenedor-matriz-temporal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <h5>Seleccionar Parcelas Destino</h5>
          <label style="font-size:11px; font-weight:bold; color:var(--color-accent-dark); cursor:pointer;">
            <input type="checkbox" id="chkMasterMasivo" onclick="window.toggleMasterMasivo(this)" /> Seleccionar Todas
          </label>
        </div>
        <div style="max-height:180px; overflow-y:auto; background:#FFF; border:1px solid var(--color-border); border-radius:4px; padding:6px;">
          ${cuadros.map(c => `
            <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-bottom:1px solid #F0F0F0; font-size:12px;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600;">
                <input type="checkbox" class="chk-masivo-parcela" value="${c.cod_parcela}" data-nombre="${escapeAttr(c.nombre)}" />
                <span>${escapeHtml(c.nombre)} <small style="color:var(--color-text-secondary);">(${escapeHtml(c.sector)})</small></span>
              </label>
              <span style="color:var(--color-accent); font-weight:bold;">${c.cant_filas || 0} filas · ${Number(c.sup).toFixed(2)} ha</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    openMiniModal("🌱 Siembra Masiva en Parcelas", "Inactiva lo anterior e inserta la nueva variedad en lote", fields, () => {
      const cultivoId = document.getElementById('masivoCultivo').value;
      const variedadName = document.getElementById('masivoVariedad').value;
      const fechaSiembra = document.getElementById('masivoFecha').value;
      const ciclo = parseInt(document.getElementById('masivoCiclo').value) || 1;
      const semillas = parseInt(document.getElementById('masivoSemillas').value) || 0;
      const mtrs = parseFloat(document.getElementById('masivoMtrs').value) || 100;

      const parcelasTildadas = Array.from(document.querySelectorAll('.chk-masivo-parcela:checked')).map(c => parseInt(c.value));
      if (!cultivoId || !variedadName || !fechaSiembra) return lanzarNotificacionFlotante("Complete cultivo, variedad y fecha.", "warning");
      if (parcelasTildadas.length === 0) return lanzarNotificacionFlotante("Seleccione al menos una parcela destino.", "warning");

      if (!db) return closeMiniModal();

      try {
        let idInvSig = obtenerSiguienteIdInventario();
        let totalImpactadas = 0;

        const transaccionMasiva = db.transaction(() => {
          parcelasTildadas.forEach(codParcela => {
            const cInfo = db.prepare("SELECT * FROM local_p_cuadros WHERE cod_parcela = ?").get(codParcela);
            if (!cInfo) return;

            // 1. Asegurar marcos
            let marcos = db.prepare("SELECT * FROM local_p_marcos_plantacion WHERE cod_parcela = ?").all(codParcela);
            if (marcos.length === 0) {
              const supMarco = (cInfo.sup || 1) / 4;
              let codMarcoSig = obtenerSiguienteIdMarcos();
              marcos = construirMarcosValle(cInfo.nombre).map(combo => {
                const cod = codMarcoSig++;
                db.prepare("INSERT INTO local_p_marcos_plantacion (cod_marco, cod_parcela, nombre_parcela, SupTotal, valvula_riego, lamina_riego, cuadro, orientacion, nombre_zona, turno, sincronizado) VALUES (?, ?, ?, ?, ?, 4, ?, ?, ?, 1, 0)")
                  .run(cod, codParcela, `${cInfo.sector} ${cInfo.nombre}`, supMarco, combo.valvula_riego, combo.cuadro, combo.orientacion, cInfo.sector);
                return { ...combo, cod_marco: cod, SupTotal: supMarco };
              });
            }

            // 2. Inactivar todo lo activo en esta parcela
            db.prepare(`
              UPDATE local_p_inventario_plantacion 
              SET estado = 'INACTIVO', sincronizado = 0 
              WHERE estado = 'ACTIVO' AND cod_marco IN (SELECT cod_marco FROM local_p_marcos_plantacion WHERE cod_parcela = ?)
            `).run(codParcela);

            // 3. Determinar número de filas históricas
            const filasHist = db.prepare(`
              SELECT DISTINCT fila FROM local_p_inventario_plantacion 
              WHERE cod_marco IN (SELECT cod_marco FROM local_p_marcos_plantacion WHERE cod_parcela = ?)
            `).all(codParcela);

            let cantFilas = filasHist.length > 0 ? filasHist.length : 25;
            const supMarcoBase = marcos[0]?.SupTotal || 0.25;
            const supPorFila = supMarcoBase / cantFilas;

            const insertInv = db.prepare(`
              INSERT INTO local_p_inventario_plantacion 
                (id_inv, cod_marco, zona, turno_riego, orientacion, cuadro, fila, v_riego, mtrs_surco, sup, variedad, estado, ciclo, estado_fila, fecha_siembra, semillas_x_mtrs, sincronizado) 
              VALUES (?, ?, ?, 1, ?, ?, ?, ?, ?, ?, ?, 'ACTIVO', ?, 'OK', ?, ?, 0)
            `);

            for (let f = 1; f <= cantFilas; f++) {
              marcos.forEach(m => {
                const orient = m.orientacion || 'NORTE';
                const valv = m.valvula_riego || 'NORTE';
                const cInv = `${m.cuadro || cInfo.nombre} - ${orient.charAt(0)}`;
                insertInv.run(
                  idInvSig++,
                  m.cod_marco,
                  cInfo.sector || 'ZONA',
                  orient,
                  cInv,
                  f,
                  valv,
                  String(mtrs),
                  supPorFila,
                  variedadName,
                  ciclo,
                  fechaSiembra,
                  semillas
                );
              });
            }
            totalImpactadas++;
          });
        });

        transaccionMasiva();
        lanzarNotificacionFlotante(`Siembra masiva de '${variedadName}' completada en ${totalImpactadas} parcelas con éxito.`, 'success');
        closeMiniModal();
        cargarSeccion();
      } catch(err) {
        console.error(err);
        lanzarNotificacionFlotante("Error en siembra masiva: " + err.message, "error");
      }
    });

    const masCultivo = document.getElementById('masivoCultivo');
    const masVar = document.getElementById('masivoVariedad');
    masCultivo.addEventListener('change', () => {
      if (!masCultivo.value) {
        masVar.innerHTML = '<option value="">-- Elija un cultivo --</option>';
        masVar.disabled = true;
        return;
      }
      let list = [];
      if (db) {
        try { list = db.prepare("SELECT variedad FROM local_p_variedades WHERE cod_esp = ? ORDER BY variedad ASC").all(masCultivo.value); } catch(e){}
      }
      masVar.innerHTML = '<option value="">-- Seleccionar Variedad --</option>' + list.map(v => `<option value="${escapeHtml(v.variedad)}">${escapeHtml(v.variedad)}</option>`).join('');
      masVar.disabled = false;
    });

    window.toggleMasterMasivo = function(chk) {
      document.querySelectorAll('.chk-masivo-parcela').forEach(c => c.checked = chk.checked);
    };
  };

                <td style="text-align:center; font-weight:700; background:#FAFAFA;"># ${s.fila}</td>
                <td style="text-align:center; color:var(--color-text-secondary);">${escapeHtml(s.mtrs_surco || '100m')}</td>
                <td style="text-align:center;">${s.sup ? parseFloat(s.sup).toFixed(3) + ' ha' : '0.00 ha'}</td>
                <td style="text-align:center; font-weight:bold; color:#107C41; background:rgba(16,124,65,0.05); font-size:14px;">${s.semillas_x_mtrs || 0}</td>
              </tr>
            `).join('')}
            ${surcosAExportar.length === 0 ? '<tr><td colspan="5" class="vista-vacia">Ningún surco activo coincide con el filtro de pantalla.</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    `;

    openMiniModal(
      "Previsualización de Hojas Excel de Campo",
      `Infraestructura Agrosoft J&L · ${subtituloFiltro} (${surcosAExportar.length} registros)`,
      excelBodyHtml,
      async () => {
        if (!isElectron) {
          return lanzarNotificacionFlotante("La descarga de Excel solo está disponible en la app de escritorio.", "warning");
        }
        if (surcosAExportar.length === 0) {
          return lanzarNotificacionFlotante("No hay surcos para exportar con el filtro actual.", "warning");
        }
        try {
          const ExcelJS = require('exceljs');
          const os = require('os');
          const pathMod = require('path');
          const fs = require('fs');

          const wb = new ExcelJS.Workbook();
          wb.creator = 'Gordon Gestión · Agrosoft J&L';
          const ws = wb.addWorksheet('Surcos de Campo');

          ws.columns = [
            { header: 'PARCELA / CUADRO', key: 'cuadro', width: 24 },
            { header: 'NRO SURCO (FILA)', key: 'fila', width: 16 },
            { header: 'VARIEDAD', key: 'variedad', width: 22 },
            { header: 'LARGO SURCO', key: 'mtrs', width: 14 },
            { header: 'SUPERFICIE (HA)', key: 'sup', width: 15 },
            { header: 'SEMILLAS X METRO', key: 'sem', width: 18 },
            { header: 'CICLO', key: 'ciclo', width: 10 },
            { header: 'FECHA SIEMBRA', key: 'fecha', width: 16 },
            { header: 'ESTADO FILA', key: 'estado', width: 16 }
          ];

          const headerRow = ws.getRow(1);
          headerRow.eachCell(cell => {
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E6B4C' } };
            cell.alignment = { vertical: 'middle', horizontal: 'center' };
          });
          headerRow.height = 22;

          surcosAExportar.forEach(s => {
            ws.addRow({
              cuadro: s.cuadro || '—',
              fila: s.fila,
              variedad: s.variedad || '—',
              mtrs: s.mtrs_surco || '',
              sup: (s.sup !== null && s.sup !== undefined && s.sup !== '') ? Number(parseFloat(s.sup).toFixed(3)) : 0,
              sem: s.semillas_x_mtrs || 0,
              ciclo: (s.ciclo !== null && s.ciclo !== undefined) ? ('C.' + s.ciclo) : '—',
              fecha: s.fecha_siembra || '—',
              estado: (s.estado_fila || 'OK')
            });
          });

          const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
          const nombreArchivo = `Surcos_Campo_${stamp}.xlsx`;
          const carpetaDescargas = pathMod.join(os.homedir(), 'Downloads');
          if (!fs.existsSync(carpetaDescargas)) fs.mkdirSync(carpetaDescargas, { recursive: true });
          const rutaFinal = pathMod.join(carpetaDescargas, nombreArchivo);

          await wb.xlsx.writeFile(rutaFinal);
          lanzarNotificacionFlotante(`¡Excel guardado en Descargas: ${nombreArchivo}!`, "success");
          closeMiniModal();
        } catch (err) {
          console.error(err);
          lanzarNotificacionFlotante("Error al generar el Excel: " + err.message, "error");
        }
      }
    );
    modalBtnSave.textContent = "Descargar .XLSX";
    modalBtnSave.style.background = "#107C41";
  };

  window.ejecutarAsignacionMasivaSemillas = function(queryFiltro, arrayArgs) {
    const inputValor = document.getElementById('txtSemillasLoteExcel');
    const valorSemillas = parseInt(inputValor ? inputValor.value : NaN);
    
    if (isNaN(valorSemillas) || valorSemillas < 0) {
      return lanzarNotificacionFlotante("Ingrese una cantidad válida de semillas.", "warning");
    }

    if (db) {
      try {
        let queryUpdate = queryFiltro.split("WHERE")[1].split("ORDER BY")[0];
        let sqlFinal = `UPDATE local_p_inventario_plantacion SET semillas_x_mtrs = ?, sincronizado = 0 WHERE ${queryUpdate}`;
        
        db.prepare(sqlFinal).run(valorSemillas, ...arrayArgs);
        lanzarNotificacionFlotante(`Asignación masiva exitosa: ${valorSemillas} semillas/metro aplicadas`, "success");
        
        closeMiniModal();
        cargarSeccion(); 
      } catch (err) {
        lanzarNotificacionFlotante("Error al aplicar cambios en lote: " + err.message, "error");
      }
    } else {
      closeMiniModal();
    }
  };

  // =========================================================================
  // SIEMBRA ASISTIDA EN CASCADA COMPLETA (VALLE 4 SECTORES)
  // =========================================================================
  window.modalSembrarProcedimientoAvanzado = function(codParcela, cuadroNombre) {
    if (!codParcela && !cuadroNombre) {
      return lanzarNotificacionFlotante('Seleccione un cuadro en la columna central.', 'warning');
    }
    customModal.querySelector('.modal-box').style.maxWidth = '720px';

    let cuadroInfo = null;
    if (db) {
      try {
        cuadroInfo = db.prepare("SELECT * FROM local_p_cuadros WHERE cod_parcela = ? OR nombre = ?").get(codParcela, cuadroNombre);
      } catch(e) { console.error('Error obteniendo cuadro:', e); }
    }
    const codParcelaReal = cuadroInfo ? cuadroInfo.cod_parcela : codParcela;
    const cuadroNombreReal = cuadroInfo ? cuadroInfo.nombre : (cuadroNombre || 'PARCELA');
    const sectorReal = (cuadroInfo && cuadroInfo.sector) ? cuadroInfo.sector : (sectorSeleccionado || 'ZONA GENERAL');

    let marcosParcela = [];
    if (db && codParcelaReal) {
      try {
        marcosParcela = db.prepare("SELECT * FROM local_p_marcos_plantacion WHERE cod_parcela = ? ORDER BY cod_marco ASC").all(codParcelaReal);
      } catch(e) {}
    }

    if (marcosParcela.length === 0 && db) {
      try {
        marcosParcela = db.prepare("SELECT * FROM local_p_marcos_plantacion WHERE cuadro LIKE ? || '%' OR nombre_parcela LIKE '%' || ? ORDER BY cod_marco ASC").all(cuadroNombreReal, cuadroNombreReal);
      } catch(e) {}
    }

    let filasHistoricasInv = [];
    if (db && marcosParcela.length > 0) {
      try {
        const placeholders = marcosParcela.map(() => '?').join(',');
        const cods = marcosParcela.map(m => m.cod_marco);
        filasHistoricasInv = db.prepare(`
          SELECT 
            inv.fila,
            inv.variedad,
            inv.estado,
            inv.mtrs_surco,
            inv.sup,
            inv.fecha_siembra,
            inv.semillas_x_mtrs,
            inv.cuadro as ciclo,
            m.cuadro as marco_cuadro,
            m.valvula_riego,
            m.orientacion
          FROM local_p_inventario_plantacion inv
          INNER JOIN local_p_marcos_plantacion m ON inv.cod_marco = m.cod_marco
          WHERE inv.cod_marco IN (${placeholders})
          ORDER BY CAST(inv.fila AS INTEGER) ASC, inv.fila ASC
        `).all(...cods);
      } catch(e) { console.error("Error recuperando histórico de inventario:", e); }
    }

    let minFila = 1, maxFila = 1;
    const filasUnicasNums = Array.from(new Set(filasHistoricasInv.map(f => parseInt(f.fila)).filter(n => !isNaN(n)))).sort((a, b) => a - b);
    if (filasUnicasNums.length > 0) {
      minFila = Math.min(...filasUnicasNums);
      maxFila = Math.max(...filasUnicasNums);
    }

    let cultivos = [];
    if (db) { 
      try { 
        cultivos = db.prepare("SELECT cod_esp, especie FROM local_p_cultivo ORDER BY especie ASC").all(); 
      } catch(e){} 
    } else { 
      cultivos = [{ cod_esp: 1, especie: 'Manzanas' }]; 
    }

    const hoyStr = new Date().toISOString().split('T')[0];

    const estadoFilasTexto = filasUnicasNums.length > 0 
      ? `Filas detectadas en inventario: #${minFila} a #${maxFila} (${filasUnicasNums.length} fila/s física/s)`
      : `Parcela vacía / Sin registros previos de siembra`;

    const fields = `
      <div style="background:#F8FAFC; border:1px solid var(--color-border); border-radius:var(--radius-md); padding:10px 14px; margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; font-weight:800; color:var(--color-accent-dark);">📍 ${escapeHtml(cuadroNombreReal)}</span>
          <span class="badge-sector-pill">${escapeHtml(sectorReal)}</span>
        </div>
        <div style="font-size:11px; color:var(--color-text-secondary); margin-top:3px;">
          ${estadoFilasTexto} · <strong style="color:var(--color-accent);">4 Sectores por Fila (NORTE-N, NORTE-S, SUR-N, SUR-S)</strong>
        </div>
      </div>

      <div class="modal-row-grid">
        <div class="modal-group">
          <label for="smbCultivo">Cultivo *</label>
          <select id="smbCultivo" class="modal-select" style="font-weight:700;">
            <option value="">-- Seleccione Cultivo --</option>
            ${cultivos.map(c => `<option value="${c.cod_esp}">${escapeHtml(c.especie)}</option>`).join('')}
          </select>
        </div>
        <div class="modal-group">
          <label for="smbVariedad">Variedad *</label>
          <select id="smbVariedad" class="modal-select" disabled><option value="">-- Elija un cultivo --</option></select>
        </div>
      </div>

      <div class="modal-row-grid">
        <div class="modal-group">
          <label for="smbDesde">Desde Fila</label>
          <input type="number" id="smbDesde" class="modal-input" min="1" value="${minFila}" />
        </div>
        <div class="modal-group">
          <label for="smbHasta">Hasta Fila (Aumentar para agregar más filas)</label>
          <input type="number" id="smbHasta" class="modal-input" min="1" value="${maxFila}" />
        </div>
      </div>

      <div class="modal-row-grid">
        <div class="modal-group">
          <label for="smbCiclo">Ciclo Productivo</label>
          <select id="smbCiclo" class="modal-select">
            <option value="1">Ciclo 1</option>
            <option value="2">Ciclo 2</option>
            <option value="3" selected>Ciclo 3</option>
            <option value="4">Ciclo 4</option>
          </select>
        </div>
        <div class="modal-group">
          <label for="smbFecha">Fecha de Siembra</label>
          <input type="date" id="smbFecha" class="modal-input" value="${hoyStr}" />
        </div>
      </div>

      <div class="modal-row-grid">
        <div class="modal-group">
          <label for="smbSemillasXMtrs">Semillas por Metro</label>
          <input type="number" id="smbSemillasXMtrs" class="modal-input" min="0" value="12" placeholder="Ej. 12" />
        </div>
        <div class="modal-group">
          <label for="smbMtrsSurco">Largo Surco (Metros)</label>
          <input type="number" id="smbMtrsSurco" class="modal-input" min="1" value="100" />
        </div>
      </div>

      <div class="contenedor-matriz-temporal">
        <h5>Previsualización de Siembra (Se impacta en los 4 sectores por fila)</h5>
        <div style="max-height:140px; overflow-y:auto; background:#FFF;">
          <table class="tabla-temporal" id="tablaPreviewSiembra">
            <thead>
              <tr>
                <th style="width:65px; text-align:center;">Fila</th>
                <th>Sector / Orientación (4 por fila)</th>
                <th>Variedad</th>
                <th>Fecha</th>
                <th>Dosif.</th>
              </tr>
            </thead>
            <tbody id="bodyPreviewSiembra">
              <tr><td colspan="5" style="text-align:center; color:var(--color-text-secondary); padding:10px;">Defina el rango y variedad...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `;

    openMiniModal(`🌱 Sembrar en ${cuadroNombreReal}`, 'Configuración de siembra y generación de líneas', fields, () => {
      const cultivoId = document.getElementById('smbCultivo').value;
      const variedadName = document.getElementById('smbVariedad').value;
      const desdeF = parseInt(document.getElementById('smbDesde').value);
      const hastaF = parseInt(document.getElementById('smbHasta').value);
      const cicloId = parseInt(document.getElementById('smbCiclo').value);
      const fechaSiembra = document.getElementById('smbFecha').value;
      const semillasXMtrs = parseInt(document.getElementById('smbSemillasXMtrs').value) || 0;
      const mtrsSurco = parseFloat(document.getElementById('smbMtrsSurco').value) || 100;

      if (!cultivoId || !variedadName || isNaN(desdeF) || isNaN(hastaF) || !fechaSiembra) { 
        return lanzarNotificacionFlotante('Complete todos los parámetros requeridos.', 'warning');
      }
      if (desdeF > hastaF || desdeF < 1) { 
        return lanzarNotificacionFlotante('Rango de filas numérico inválido.', 'warning'); 
      }

      if (!db) return closeMiniModal();

      try {
        const transaccionSiembra = db.transaction(() => {
          let marcosActuales = db.prepare("SELECT * FROM local_p_marcos_plantacion WHERE cod_parcela = ? ORDER BY cod_marco ASC").all(codParcelaReal);
          
          if (marcosActuales.length === 0) {
            const supCuadro = (cuadroInfo && cuadroInfo.sup) ? parseFloat(cuadroInfo.sup) : 4.0;
            const supPorMarco = supCuadro / 4;
            const zonaInv = abreviarZonaInventario(sectorReal, cuadroNombreReal);
            const nombreParcela = `${sectorReal} ${cuadroNombreReal}`;

            let codMarcoAuto = obtenerSiguienteIdMarcos();
            marcosActuales = construirMarcosValle(cuadroNombreReal).map(combo => {
              const cod = codMarcoAuto++;
              db.prepare(`INSERT INTO local_p_marcos_plantacion (cod_marco, cod_parcela, nombre_parcela, SupTotal, valvula_riego, lamina_riego, cuadro, orientacion, nombre_zona, turno, sincronizado) VALUES (?, ?, ?, ?, ?, 4, ?, ?, ?, 1, 0)`)
                .run(cod, codParcelaReal, nombreParcela, supPorMarco, combo.valvula_riego, combo.cuadro, combo.orientacion, sectorReal);
              return { ...combo, cod_marco: cod, SupTotal: supPorMarco };
            });
          }

          const cantFilasTotal = (hastaF - desdeF) + 1;
          const supMarcoBase = (marcosActuales[0] && marcosActuales[0].SupTotal) ? parseFloat(marcosActuales[0].SupTotal) : 1.0;
          const supPorFila = supMarcoBase / cantFilasTotal;

          const stmtSelectActivo = db.prepare(`SELECT id_inv FROM local_p_inventario_plantacion WHERE cod_marco = ? AND CAST(fila AS INTEGER) = ? AND estado = 'ACTIVO'`);
          const stmtUpdateInactivo = db.prepare(`UPDATE local_p_inventario_plantacion SET estado = 'INACTIVO', sincronizado = 0 WHERE id_inv = ?`);
          const stmtInsertInv = db.prepare(`
            INSERT INTO local_p_inventario_plantacion 
              (id_inv, cod_marco, zona, turno_riego, orientacion, cuadro, fila, v_riego, mtrs_surco, sup, variedad, estado, ciclo, estado_fila, fecha_siembra, semillas_x_mtrs, sincronizado) 
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 'ACTIVO', ?, 'OK', ?, ?, 0)
          `);

          let idInvSiguiente = obtenerSiguienteIdInventario();

          for (let f = desdeF; f <= hastaF; f++) {
            marcosActuales.forEach(marco => {
              const rowActiva = stmtSelectActivo.get(marco.cod_marco, f);
              if (rowActiva) {
                stmtUpdateInactivo.run(rowActiva.id_inv);
              }

              const orientacion = marco.orientacion || 'NORTE';
              const valvula = marco.valvula_riego || 'NORTE';
              const etiquetaCuadroInv = marco.cuadro_inventario || `${marco.cuadro || cuadroNombreReal} - ${orientacion.charAt(0)}`;
              const zonaInv = marco.nombre_zona || sectorReal;

              stmtInsertInv.run(
                idInvSiguiente++,
                marco.cod_marco,
                zonaInv,
                marco.turno || 1,
                orientacion,
                etiquetaCuadroInv,
                f,
                valvula,
                String(mtrsSurco),
                supPorFila,
                variedadName,
                cicloId,
                fechaSiembra,
                semillasXMtrs
              );
            });
          }
        });

        transaccionSiembra();
        lanzarNotificacionFlotante(`Siembra de '${variedadName}' completada en ${cuadroNombreReal} (Filas #${desdeF} a #${hastaF})`, 'success');
        closeMiniModal(); 
        cargarSeccion();
      } catch(err) { 
        console.error(err);
        lanzarNotificacionFlotante('Error en siembra: ' + err.message, 'error'); 
      }
    });

    const cSel = document.getElementById('smbCultivo');
    const vSel = document.getElementById('smbVariedad');
    const inpDesde = document.getElementById('smbDesde');
    const inpHasta = document.getElementById('smbHasta');
    const bodyPreview = document.getElementById('bodyPreviewSiembra');

    function actualizarSimulacionTabla() {
      const desdeF = parseInt(inpDesde.value); 
      const hastaF = parseInt(inpHasta.value); 
      const varSeleccionada = vSel.value || '—';
      const inputSem = document.getElementById('smbSemillasXMtrs');
      const semVal = inputSem ? (inputSem.value || 0) : 0;

      if (isNaN(desdeF) || isNaN(hastaF) || desdeF > hastaF || desdeF < 1) { 
        bodyPreview.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#C62828;">Rango numérico inválido</td></tr>`; 
        return; 
      }

      const sectoresNombres = ['NORTE - N', 'NORTE - S', 'SUR - N', 'SUR - S'];
      let html = '';
      for (let f = desdeF; f <= hastaF; f++) {
        sectoresNombres.forEach((sec, idx) => {
          html += `
            <tr>
              ${idx === 0 ? `<td rowspan="4" style="text-align:center; font-weight:bold; background:#F4F6F4; vertical-align:middle; border-right:1px solid #D2D7D3;">#${f}</td>` : ''}
              <td><span class="badge-sector-pill">${escapeHtml(cuadroNombreReal)} ${sec}</span></td>
              <td style="color:#1B5E20; font-weight:700;">${escapeHtml(varSeleccionada)}</td>
              <td>${hoyStr}</td>
              <td style="text-align:center; font-weight:bold; color:#107C41;">${semVal} s/m</td>
            </tr>
          `;
        });
      }
      bodyPreview.innerHTML = html;
    }

    cSel.addEventListener('change', () => {
      if (!cSel.value) { 
        vSel.innerHTML = '<option value="">-- Elija un cultivo --</option>'; 
        vSel.disabled = true; 
        return; 
      }
      let list = []; 
      if (db) { 
        try { 
          list = db.prepare("SELECT variedad FROM local_p_variedades WHERE cod_esp = ? ORDER BY variedad ASC").all(cSel.value); 
        } catch(e){} 
      }
      vSel.innerHTML = '<option value="">-- Seleccione Variedad --</option>' + list.map(v => `<option value="${escapeHtml(v.variedad)}">${escapeHtml(v.variedad)}</option>`).join('');
      vSel.disabled = false; 
      actualizarSimulacionTabla();
    });

    vSel.addEventListener('change', actualizarSimulacionTabla); 
    inpDesde.addEventListener('input', actualizarSimulacionTabla); 
    inpHasta.addEventListener('input', actualizarSimulacionTabla);
    document.getElementById('smbSemillasXMtrs').addEventListener('input', actualizarSimulacionTabla);
  };

  cargarSeccion();
})();
</script>
</body>
</html>
