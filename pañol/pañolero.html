  function code128Modulos(texto) {
    const limpio = String(texto == null ? '' : texto).replace(/[^\x20-\x7E]/g, '').slice(0, 40) || ' ';
    const valores = [];
    for (let i = 0; i < limpio.length; i++) valores.push(limpio.charCodeAt(i) - 32);

    let suma = 104;
    valores.forEach((v, i) => { suma += v * (i + 1); });
    const indices = [104].concat(valores, [suma % 103, 106]);

    const trama = indices.map(i => CODE128_PATRONES[i]).join('');
    const elementos = [];
    let totalModulos = 0;
    for (let i = 0; i < trama.length; i++) {
      const ancho = parseInt(trama.charAt(i), 10);
      elementos.push({ barra: i % 2 === 0, ancho: ancho });
      totalModulos += ancho;
    }
    return { elementos: elementos, totalModulos: totalModulos, texto: limpio };
  }

  function dibujarCodigoBarrasPdf(doc, texto, x, y, ancho, alto) {
    const cb = code128Modulos(texto);
    const modulo = ancho / cb.totalModulos;
    doc.setFillColor(0, 0, 0);
    let cursor = x;
    cb.elementos.forEach(el => {
      const w = el.ancho * modulo;
      if (el.barra) doc.rect(cursor, y, w, alto, 'F');
      cursor += w;
    });
    doc.setFont('courier', 'normal'); doc.setFontSize(6.4); doc.setTextColor(60, 60, 60);
    doc.text(cb.texto, x + ancho / 2, y + alto + 2.6, { align: 'center' });
  }

  function codigoBarrasPngBase64(texto, anchoPx, altoPx) {
    try {
      const cb = code128Modulos(texto);
      const lienzo = document.createElement('canvas');
      lienzo.width = anchoPx; lienzo.height = altoPx;
      const ctx = lienzo.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, anchoPx, altoPx);
      const modulo = anchoPx / cb.totalModulos;
      const altoBarras = altoPx - 13;
      ctx.fillStyle = '#000000';
      let cursor = 0;
      cb.elementos.forEach(el => {
        const w = el.ancho * modulo;
        if (el.barra) ctx.fillRect(cursor, 0, w, altoBarras);
        cursor += w;
      });
      ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(cb.texto, anchoPx / 2, altoPx - 1);
      return lienzo.toDataURL('image/png');
    } catch (e) { return null; }
  }

    const datos = q(`

             m.articulo, m.cantidad, m.estado, m.descripcion as observacion,

             ON TRIM(CAST(cat.articulo AS TEXT)) = TRIM(CAST(m.articulo AS TEXT))
      WHERE UPPER(TRIM(IFNULL(m.estado, ''))) IN ('DESPACHADO', 'DEVOLUCION', 'EGRESO', 'SALIDA', 'ENTREGA', 'ACTIVO')
         OR m.estado IS NULL

      cols.forEach((c, i) => {
        columnStyles[i] = { cellWidth: c.mm, halign: c.halign || 'left' };
        if (c.destacada) { columnStyles[i].fontStyle = 'bold'; columnStyles[i].textColor = RGB_PAN_DARK; }
      });

      autoTable(doc, {
        startY: ALTO_HEADER + 4,
        margin: { left: margen, right: margen, top: ALTO_HEADER + 4, bottom: ALTO_PIE + 6 },
        head: [cols.map(c => c.header)],
        body: rep.filas.map(f => cols.map(c => {
          const v = f[c.key];
          return c.numero ? n1(v) : String(v == null ? '' : v);
        })),
        headStyles: { fillColor: RGB_PAN, textColor: 255, fontSize: 7.6, fontStyle: 'bold', halign: 'center', valign: 'middle' },
        styles: { fontSize: 7.4, cellPadding: 2, lineColor: [222, 226, 230], lineWidth: 0.12, overflow: 'linebreak', valign: 'middle' },
        alternateRowStyles: { fillColor: [247, 248, 249] },
        columnStyles: columnStyles,
        theme: 'grid',
        didDrawPage: dibujarEncabezado
      });

      let y = ((doc.lastAutoTable && doc.lastAutoTable.finalY) || ALTO_HEADER + 4) + 8;
      const altoBloque = 46;
      if (y + altoBloque > pageH - ALTO_PIE) {
        doc.addPage();
        dibujarEncabezado({ pageNumber: doc.internal.getNumberOfPages() });
        y = ALTO_HEADER + 8;
      }

      const anchoPanel = pageW - margen * 2;
      doc.setFillColor(248, 249, 249); doc.setDrawColor(222, 226, 230); doc.setLineWidth(0.25);
      doc.roundedRect(margen, y, anchoPanel, 22, 2, 2, 'FD');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(RGB_PAN[0], RGB_PAN[1], RGB_PAN[2]);
      doc.text('RESUMEN DEL INFORME', margen + 5, y + 6);

      const porFila = Math.min(rep.resumen.length, 6);
      const anchoItem = (anchoPanel - 10) / porFila;
      rep.resumen.forEach((r, i) => {
        const xi = margen + 5 + anchoItem * i;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6.8); doc.setTextColor(120, 128, 135);
        doc.text(String(r.label).toUpperCase(), xi, y + 12.5);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(RGB_PAN_DARK[0], RGB_PAN_DARK[1], RGB_PAN_DARK[2]);
        doc.text(String(r.valor), xi, y + 18.5);
      });

      const yFirma = y + 40;
      doc.setDrawColor(98, 107, 116); doc.setLineWidth(0.25);
      doc.line(margen + 20, yFirma, margen + 90, yFirma);
      doc.line(pageW - margen - 90, yFirma, pageW - margen - 20, yFirma);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.6); doc.setTextColor(98, 107, 116);
      doc.text(rep.firmas[0], margen + 55, yFirma + 4.5, { align: 'center' });
      doc.text(rep.firmas[1], pageW - margen - 55, yFirma + 4.5, { align: 'center' });

      const totalPaginas = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPaginas; i++) {
        doc.setPage(i);
        doc.setDrawColor(222, 226, 230); doc.setLineWidth(0.2);
        doc.line(margen, pageH - 11.5, pageW - margen, pageH - 11.5);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7.2); doc.setTextColor(98, 107, 116);
        doc.text(PIE_INSTITUCIONAL, margen, pageH - 7);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
        doc.text('Folio ' + folio + '  ·  Página ' + i + ' de ' + totalPaginas, pageW - margen, pageH - 7, { align: 'right' });
      }

      const nombre = rep.archivo + '_' + hoyStr() + '.pdf';
      guardarEnDescargas(nombre, Buffer.from(doc.output('arraybuffer')));
      lanzarToast('PDF guardado en Descargas: ' + nombre);
    } catch (err) {
      console.error(err);
      lanzarToast('Error al generar el PDF: ' + err.message, 'error');
    }
  }

  async function exportarReporteExcel(rep) {
    try {
      const ExcelJS = require('exceljs');
      const wb = new ExcelJS.Workbook();
      wb.creator = 'Gordon Gestión · Pañol';
      wb.created = new Date();

      const ws = wb.addWorksheet(rep.hoja.slice(0, 31), {
        views: [{ state: 'frozen', ySplit: 5 }],
        pageSetup: {
          orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
          paperSize: 9, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.6, header: 0.2, footer: 0.3 }
        }
      });

      const cols = rep.columnas;
      ws.columns = cols.map(c => ({ header: c.header, key: c.key, width: c.xl }));
      rep.filas.forEach(f => ws.addRow(f));

      ws.spliceRows(1, 0, [], [], [], []);
      const nCols = cols.length;
      const folio = generarFolio(rep.prefijoFolio);

      ws.getRow(1).height = 34;
      ws.getRow(2).height = 16;
      ws.getRow(3).height = 15;
      ws.getRow(4).height = 15;

      ws.mergeCells(1, 2, 1, nCols);
      ws.mergeCells(2, 2, 2, nCols);
      ws.mergeCells(3, 2, 3, nCols);
      ws.mergeCells(4, 2, 4, nCols);

      const cTitulo = ws.getCell(1, 2);
      cTitulo.value = 'GORDON GESTIÓN · PAÑOL — ' + rep.titulo;
      cTitulo.font = { bold: true, size: 15, color: { argb: 'FF1E2A30' } };
      cTitulo.alignment = { vertical: 'middle', horizontal: 'left' };

      const cSub = ws.getCell(2, 2);
      cSub.value = rep.subtitulo;
      cSub.font = { italic: true, size: 10, color: { argb: 'FF626B74' } };
      cSub.alignment = { vertical: 'middle', horizontal: 'left' };

      const cEmpresa = ws.getCell(3, 2);
      cEmpresa.value = EMPRESA_RAZON + ' — ' + EMPRESA_DOMICILIO;
      cEmpresa.font = { size: 9, color: { argb: 'FF626B74' } };
      cEmpresa.alignment = { vertical: 'middle', horizontal: 'left' };

      const cMeta = ws.getCell(4, 2);
      cMeta.value = 'Folio: ' + folio + '   ·   Emitido: ' + new Date().toLocaleString('es-AR') +
                    '   ·   Operario: ' + operarioName + '   ·   Registros: ' + rep.filas.length;
      cMeta.font = { bold: true, size: 9, color: { argb: 'FF37474F' } };
      cMeta.alignment = { vertical: 'middle', horizontal: 'left' };

      const logoBase64 = cargarLogoBase64();
      if (logoBase64) {
        try {
          const idLogo = wb.addImage({ base64: 'data:image/png;base64,' + logoBase64, extension: 'png' });
          ws.addImage(idLogo, { tl: { col: 0.15, row: 0.1 }, ext: { width: 76, height: 76 }, editAs: 'oneCell' });
        } catch (e) { console.warn('Logo no incrustado en Excel:', e.message); }
      }

      const cbBase64 = codigoBarrasPngBase64(folio, 420, 62);
      if (cbBase64) {
        try {
          const idCb = wb.addImage({ base64: cbBase64, extension: 'png' });
          ws.addImage(idCb, { tl: { col: Math.max(nCols - 3, 1), row: 0.15 }, ext: { width: 240, height: 46 }, editAs: 'oneCell' });
        } catch (e) { console.warn('Código de barras no incrustado:', e.message); }
      }

      const filaHead = ws.getRow(5);
      filaHead.height = 24;
      filaHead.eachCell({ includeEmpty: true }, cell => {
        cell.font = { bold: true, size: 10, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: ARGB_PAN } };
        cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
        cell.border = { bottom: { style: 'thin', color: { argb: 'FF1E2A30' } } };
      });

      const primeraFila = 6;
      const ultimaFila = primeraFila + rep.filas.length - 1;
      for (let r = primeraFila; r <= ultimaFila; r++) {
        const fila = ws.getRow(r);
        cols.forEach((c, i) => {
          const cell = fila.getCell(i + 1);
          cell.alignment = { vertical: 'middle', horizontal: c.halign || 'left', wrapText: false };
          cell.font = { size: 9.5, bold: !!c.destacada };
          cell.border = {
            top: { style: 'hair', color: { argb: 'FFDEE2E6' } },
            bottom: { style: 'hair', color: { argb: 'FFDEE2E6' } }
          };
          if (c.numero) cell.numFmt = '#,##0.0';
        });
        if ((r - primeraFila) % 2 === 1) {
          fila.eachCell({ includeEmpty: true }, cell => {
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF7F8F9' } };
          });
        }
      }

      if (rep.filas.length > 0) {
        const filaTot = ws.getRow(ultimaFila + 2);
        filaTot.height = 20;
        cols.forEach((c, i) => {
          const cell = filaTot.getCell(i + 1);
          if (i === 0) cell.value = 'TOTALES';
          else if (c.numero) cell.value = { formula: `SUM(${cell.address.replace(/\d+$/, '')}${primeraFila}:${cell.address.replace(/\d+$/, '')}${ultimaFila})` };
          cell.font = { bold: true, size: 10, color: { argb: 'FFFFFFFF' } };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E2A30' } };
          cell.alignment = { vertical: 'middle', horizontal: c.halign || 'left' };
          if (c.numero) cell.numFmt = '#,##0.0';
        });
      }

      const wsRes = wb.addWorksheet('Resumen');
      wsRes.columns = [{ header: 'INDICADOR', key: 'label', width: 34 }, { header: 'VALOR', key: 'valor', width: 20 }];
      wsRes.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: ARGB_PAN } };
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
      });
      wsRes.getRow(1).height = 22;
      rep.resumen.forEach(r => wsRes.addRow({ label: r.label, valor: r.valor }));
      wsRes.addRow({});
      wsRes.addRow({ label: 'Folio', valor: folio });
      wsRes.addRow({ label: 'Emitido', valor: new Date().toLocaleString('es-AR') });
      wsRes.addRow({ label: 'Operario', valor: operarioName });

      ws.autoFilter = { from: { row: 5, column: 1 }, to: { row: Math.max(ultimaFila, 5), column: nCols } };
      const pieXls = '&L&"Arial,Bold"&8' + PIE_INSTITUCIONAL + '&R&8Folio ' + folio + ' · Página &P de &N';
      ws.headerFooter = { oddFooter: pieXls, evenFooter: pieXls };
      wsRes.headerFooter = { oddFooter: pieXls, evenFooter: pieXls };
      ws.pageSetup.printTitlesRow = '5:5';

      const nombre = rep.archivo + '_' + hoyStr() + '.xlsx';
      const buffer = await wb.xlsx.writeBuffer();
      guardarEnDescargas(nombre, Buffer.from(buffer));
      lanzarToast('Excel guardado en Descargas: ' + nombre);
    } catch (err) {
      console.error(err);
      lanzarToast('Error al generar el Excel: ' + err.message, 'error');
    }
  }

  function abrirModalExportacion(clave) {
    if (!isElectron) return lanzarToast('La exportación solo está disponible en la app de escritorio.', 'warning');
    if (!db) return lanzarToast('Sin conexión a la base local.', 'error');

    let rep;
    try { rep = construirReporte(clave); }
    catch (e) { console.error(e); return lanzarToast('No se pudieron leer los datos: ' + e.message, 'error'); }

    if (!rep.filas.length) return lanzarToast('No hay registros para exportar en esta solapa.', 'warning');

    const fields = `
      <div class="export-resumen-box">
        <b>${escapeHtml(rep.titulo)}</b><br>
        ${rep.filas.length} registro(s) · ${rep.resumen.map(r => `${escapeHtml(r.label)}: <b>${escapeHtml(r.valor)}</b>`).join(' · ')}
      </div>
      <div class="modal-group">
        <label>Elegí el formato de salida</label>
        <div class="export-formato-grid">
          <div class="export-opcion-card excel" id="cardExportExcel">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            <div class="tit">EXCEL (.xlsx)</div>
            <div class="desc">Planilla con membrete, logo, código de barras, totales y hoja de resumen.</div>
          </div>
          <div class="export-opcion-card pdf" id="cardExportPdf">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M9 15h6"></path></svg>
            <div class="tit">PDF (A4 apaisado)</div>
            <div class="desc">Informe con logo 2x2 cm, código de barras en cada hoja, firmas y pie institucional.</div>
          </div>
        </div>
      </div>
      <div style="font-size:10.5px; color:var(--color-text-secondary); font-weight:600; text-align:center;">
        El archivo se guarda automáticamente en la carpeta <b>Descargas</b>.
      </div>
    `;

    openMiniModal('⬇️ Exportar ' + rep.hoja, 'Documento institucional con folio y código de barras', fields, null, true);

    document.getElementById('cardExportExcel').addEventListener('click', () => {
      closeMiniModal();
      lanzarToast('Generando planilla de Excel...', 'warning');
      setTimeout(() => exportarReporteExcel(rep), 60);
    });
    document.getElementById('cardExportPdf').addEventListener('click', () => {
      closeMiniModal();
      lanzarToast('Generando informe PDF...', 'warning');
      setTimeout(() => exportarReportePdf(rep), 60);
    });
  }

  // =========================================================================
  // ARRANQUE
  // =========================================================================
  renderizarTab();
})();
</script>
