<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Ícono para pestaña normal del navegador -->
<link rel="icon" type="image/png" href="../logo.png">
<!-- Alternativa con el .ico: <link rel="shortcut icon" href="../icono.ico"> -->

<!-- Ícono oficial para Safari (Agregar a pantalla de inicio en iPhone/iPad/Mac) -->
<link rel="apple-touch-icon" href="../logo.png">

<!-- Metas para que Safari lo abra como App nativa en pantalla completa -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gordon Gestión">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gordon Gestión · Proveedores y Cuenta Corriente</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --color-bg: #F4F6F4;
    --color-surface: #FFFFFF;
    --color-text: #1A211C;
    --color-text-secondary: #556358;
    --color-border: #D2D7D3;
    --color-adm: #1E6B4C;
    --color-adm-dark: #104630;
    --color-adm-soft: rgba(30, 107, 76, 0.10);
    --color-ok: #2E7D32;
    --color-ok-soft: #E8F5E9;
    --color-warn: #C62828;
    --color-warn-soft: #FFEBEE;
    --color-blue: #0071E3;
    --color-blue-soft: #EBF3FA;
    --color-amber: #B45309;
    --color-amber-soft: #FFFBEB; /* Crema Pastel */
    --color-amber-border: #FCD34D;
    --radius-lg: 18px;
    --radius-md: 12px;
    --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); overflow: hidden; -webkit-font-smoothing: antialiased; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C4CCC6; border-radius: 20px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--color-adm); background-clip: content-box; }

  .top-system-bar { display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; padding: 12px 32px; border-bottom: 1px solid var(--color-border); height: 55px; flex-shrink: 0; }
  .user-access-info { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .system-datetime { font-size: 11px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

  .layout-adm { display: flex; height: calc(100vh - 55px); overflow: hidden; }
  .sidebar { width: 190px; background: #FFFFFF; border-right: 1px solid var(--color-border); display: flex; flex-direction: column; padding: 24px 16px; flex-shrink: 0; }

  .btn-volver { display: flex; align-items: center; gap: 8px; background: #FFFDE7; border: 1px solid #FBC02D; padding: 10px 14px; border-radius: var(--radius-md); font-size: 12px; font-weight: 700; color: #F57F17; cursor: pointer; transition: all 0.2s ease; width: 100%; justify-content: center; box-shadow: 0 2px 4px rgba(251, 192, 45, 0.15); }
  .btn-volver:hover { background: #FFF9C4; border-color: #F9A825; color: #E65100; transform: translateY(-1px); }

  .btn-volver:active, .filtro-chip:active, .btn-action:active, .fila-proveedor:active, .modal-btn:active {
    background-color: #FFFDE7 !important; border-color: #FBC02D !important;
    box-shadow: inset 0 3px 8px rgba(251, 192, 45, 0.25) !important; transform: scale(0.98);
  }

  .sidebar-titulo { font-size: 15px; font-weight: 800; margin-top: 22px; color: var(--color-adm-dark); letter-spacing: 0.5px; text-transform: uppercase; padding-left: 4px; }
  .sidebar-sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 4px; padding-left: 4px; line-height: 1.5; }

  .main-content { flex-grow: 1; padding: 24px 32px; display: flex; flex-direction: column; overflow: hidden; }

  .header-area { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; flex-shrink: 0; gap: 12px; flex-wrap: wrap; }
  .seccion-titulo-wrap { position: relative; padding-left: 15px; }
  .seccion-titulo-wrap::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 5px; border-radius: 4px; background: linear-gradient(180deg, var(--color-adm), var(--color-adm-dark)); }
  .seccion-titulo { font-size: 24px; font-weight: 800; margin: 0; color: var(--color-adm-dark); line-height: 1.15; }
  .seccion-subtitulo { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-top: 3px; }

  .btn-action { border: none; border-radius: var(--radius-md); padding: 10px 18px; font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
  .btn-nuevo { background: var(--color-adm); color: #FFFFFF; box-shadow: 0 4px 10px rgba(30, 107, 76, 0.25); }
  .btn-nuevo:hover { background: var(--color-adm-dark); transform: translateY(-1px); }
  .btn-secundario { background: #FFFFFF; color: var(--color-adm-dark); border: 1px solid var(--color-adm); box-shadow: none; }
  .btn-secundario:hover { background: var(--color-adm-soft); }
  .btn-excel { background: #107C41; color: #FFFFFF; box-shadow: 0 4px 10px rgba(16, 124, 65, 0.20); }
  .btn-excel:hover { background: #0A5C30; transform: translateY(-1px); }
  .btn-pdf { background: #B91C1C; color: #FFFFFF; box-shadow: 0 4px 10px rgba(185, 28, 28, 0.20); }
  .btn-pdf:hover { background: #991515; transform: translateY(-1px); }
  .btn-pago { background: var(--color-blue); color: #FFFFFF; box-shadow: 0 4px 10px rgba(0, 113, 227, 0.20); }
  .btn-pago:hover { background: #005BBF; transform: translateY(-1px); }

  .kpi-strip { display: flex; gap: 12px; margin-bottom: 16px; flex-shrink: 0; flex-wrap: wrap; }
  .kpi-card { flex: 1; min-width: 170px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: all 0.2s ease; }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.05); }
  .kpi-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .kpi-icon.tono-verde { background: var(--color-ok-soft); color: var(--color-ok); }
  .kpi-icon.tono-rojo { background: var(--color-warn-soft); color: var(--color-warn); }
  .kpi-icon.tono-amarillo { background: var(--color-amber-soft); color: var(--color-amber); border: 1px solid var(--color-amber-border); }
  .kpi-icon.tono-azul { background: var(--color-blue-soft); color: var(--color-blue); }
  .kpi-valor { font-size: 19px; font-weight: 900; color: var(--color-text); line-height: 1.1; }
  .kpi-valor.grande { font-size: 26px; }
  .kpi-label { font-size: 10px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  .search-input { width: 100%; padding: 11px 14px 11px 38px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23556358' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'></circle><line x1='21' y1='21' x2='16.65' y2='16.65'></line></svg>") no-repeat 12px center / 16px 16px; font-family: inherit; font-size: 13px; margin-bottom: 14px; flex-shrink: 0; transition: all 0.15s ease; }
  .search-input:focus { outline: none; border-color: var(--color-adm); box-shadow: 0 0 0 3px var(--color-adm-soft); background-color: #FFFFFF; }

  .filtros-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-shrink: 0; flex-wrap: wrap; }
  .filtro-chip { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 20px; padding: 6px 14px; font-size: 11px; font-weight: 700; color: var(--color-text-secondary); cursor: pointer; white-space: nowrap; transition: all 0.15s ease; }
  .filtro-chip:hover { border-color: var(--color-adm); color: var(--color-adm-dark); }
  .filtro-chip.active { background: var(--color-adm); border-color: var(--color-adm); color: #FFFFFF; box-shadow: 0 3px 8px rgba(30, 107, 76, 0.25); }

  .tabla-container { flex-grow: 1; overflow-y: auto; background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid var(--color-border); box-shadow: 0 4px 14px rgba(0,0,0,0.03); }
  .tabla-stock { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tabla-stock th { position: sticky; top: 0; background: #FAFAF8; padding: 12px 16px; font-size: 10px; font-weight: 800; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--color-border); text-align: left; z-index: 1; }
  .tabla-stock td { padding: 12px 16px; border-bottom: 1px solid var(--color-border); color: var(--color-text); vertical-align: middle; }
  .tabla-stock tr:last-child td { border-bottom: none; }
  .tabla-stock tr.fila-proveedor { cursor: pointer; transition: background 0.15s ease; }
  .tabla-stock tr.fila-proveedor:hover { background: #F1F9F4; }

  /* Fila estilo Crema Pastel para proveedores sin migrar */
  .tabla-stock tr.fila-pastel-migrar { background-color: var(--color-amber-soft) !important; }
  .tabla-stock tr.fila-pastel-migrar:hover { background-color: #FEF3C7 !important; }

  .prov-nombre { font-weight: 800; color: var(--color-text); font-size: 13px; letter-spacing: 0.2px; }
  .prov-sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 3px; }

  .badge-estado { padding: 4px 10px; border-radius: 7px; font-size: 9.5px; font-weight: 800; text-transform: uppercase; display: inline-block; letter-spacing: 0.3px; }
  .badge-si { background: var(--color-ok-soft); color: var(--color-ok); }
  .badge-no { background: var(--color-warn-soft); color: var(--color-warn); }
  .badge-migrar { background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; }

  .badge-tipo { padding: 4px 9px; border-radius: 7px; font-size: 9px; font-weight: 800; text-transform: uppercase; display: inline-block; letter-spacing: 0.3px; white-space: nowrap; }
  .badge-tipo.t-factura { background: var(--color-warn-soft); color: var(--color-warn); }
  .badge-tipo.t-nota_debito { background: var(--color-amber-soft); color: #B45309; }
  .badge-tipo.t-nota_credito { background: var(--color-ok-soft); color: var(--color-ok); }
  .badge-tipo.t-pago { background: var(--color-blue-soft); color: var(--color-blue); }

  .col-num { text-align: right; font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .num-debe { color: var(--color-warn); }
  .num-haber { color: var(--color-ok); }
  .num-saldo { font-weight: 900; font-size: 13.5px; }
  .num-saldo.positivo { color: var(--color-warn); }
  .num-saldo.cero { color: var(--color-text-secondary); }

  .vista-vacia { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 50px 20px; color: var(--color-text-secondary); }
  .vista-vacia svg { opacity: 0.35; }
  .vista-vacia span { font-size: 13px; font-weight: 500; }

  /* Ficha de proveedor */
  .ruta-volver { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--color-adm); cursor: pointer; margin-bottom: 14px; width: fit-content; }
  .ruta-volver:hover { text-decoration: underline; }

  .ficha-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; flex-shrink: 0; }
  .ficha-card-titulo { font-size: 10px; font-weight: 800; color: var(--color-text-secondary); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .ficha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ficha-grid .full { grid-column: 1 / -1; }

  .campo-group { display: flex; flex-direction: column; gap: 5px; }
  .campo-group label { font-size: 10.5px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
  .campo-input, .campo-select { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--color-border); font-family: inherit; font-size: 13px; background: #FAFAF8; transition: all 0.15s ease; }
  .campo-input:focus, .campo-select:focus { outline: none; border-color: var(--color-adm); background: #FFFFFF; box-shadow: 0 0 0 3px var(--color-adm-soft); }

  .ficha-header-nombre { font-size: 22px; font-weight: 900; color: var(--color-adm-dark); }
  .ficha-header-cuit { font-size: 12.5px; color: var(--color-text-secondary); font-weight: 600; margin-top: 2px; }

  /* Mini Modal Pro */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1800; opacity: 0; transition: opacity 0.2s ease; }
  .modal-overlay.show { display: flex; opacity: 1; }
  .modal-box { background: #FFFFFF; border-radius: var(--radius-lg); padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.18); border: 1px solid var(--color-border); transform: translateY(-20px); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-header { margin-bottom: 16px; }
  .modal-title { font-size: 19px; font-weight: 800; color: var(--color-adm-dark); margin: 0; }
  .modal-subtitle { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 4px; }
  .modal-body { margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 65vh; overflow-y: auto; padding-right: 4px; }
  .modal-group { display: flex; flex-direction: column; gap: 5px; }
  .modal-group label { font-size: 11px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-input, .modal-select { width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--color-border); font-family: inherit; font-size: 14px; background: #FAFAFA; transition: all 0.15s ease; }
  .modal-input:focus, .modal-select:focus { outline: none; border-color: var(--color-adm); background: #FFFFFF; box-shadow: 0 0 0 3px var(--color-adm-soft); }
  .modal-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: auto; }
  .modal-btn { border-radius: var(--radius-md); padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; }
  .modal-btn.cancel { background: transparent; border-color: var(--color-border); color: var(--color-text-secondary); }
  .modal-btn.cancel:hover { background: #F5F5F5; }
  .modal-btn.save { background: var(--color-adm); color: #FFFFFF; }
  .modal-btn.save:hover { background: var(--color-adm-dark); }

  .toast-container { position: fixed; top: 24px; right: 24px; z-index: 2500; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast-card { pointer-events: auto; background: #FFFFFF; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px 20px; display: flex; align-items: center; gap: 14px; width: 340px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); transform: translateX(120%); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .toast-card.show { transform: translateX(0); }
  .toast-card.success { border-left: 5px solid #2E7D32; background: #F1F9F4; color: #1B5E20; }
  .toast-card.error { border-left: 5px solid #C62828; background: #FFEBEE; color: #B71C1C; }
  .toast-card.warning { border-left: 5px solid #F57C00; background: #FFF3E0; color: #E65100; }
</style>
</head>
<body>

  <div class="toast-container" id="toastContenedor"></div>

  <div class="top-system-bar">
    <div class="user-access-info">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align: middle;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      operario en turno... <span id="lblOperario" style="color:var(--color-adm); font-weight:700;">—</span>
    </div>
    <div class="system-datetime" id="topDateTime">—</div>
  </div>

  <div class="layout-adm">
    <div class="sidebar">
      <button class="btn-volver" id="btnVolver">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver
      </button>
      <div class="sidebar-titulo">Contable</div>
      <div class="sidebar-sub">Proveedores, órdenes de compra y estado de cuenta corriente.</div>
    </div>

    <div class="main-content">
      <div id="vistaDinamica" style="display:flex; flex-direction:column; flex-grow:1; overflow:hidden;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Título del Modal</h3>
        <div class="modal-subtitle" id="modalSubtitle">Detalles informativos</div>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="modal-btn cancel" id="modalBtnCancel">Cancelar</button>
        <button class="modal-btn save" id="modalBtnSave">Guardar</button>
      </div>
    </div>
  </div>

<script>
(function() {
  const isElectron = typeof require === 'function';
  let db = null;
  let generarRegLocal = null;

  if (isElectron) {
    try {
      const basesModule = require('../../bases.js');
      db = basesModule.db;
      generarRegLocal = basesModule.generarRegLocal;
    } catch (e) { console.error('Error al iniciar bases.js:', e); }
  }

  let operarioName = 'ADMINISTRADOR';
  if (isElectron) {
    try {
      const auth = require('../../auth.js');
      const sesion = auth.obtenerSesionActiva ? auth.obtenerSesionActiva() : null;
      if (sesion && sesion.nombre_completo) operarioName = sesion.nombre_completo;
    } catch (e) { /* auth opcional */ }
  }

  function q(sql, ...args) { if (!db) return []; try { return db.prepare(sql).all(...args); } catch (e) { console.error(sql, e); return []; } }
  function qGet(sql, ...args) { if (!db) return null; try { return db.prepare(sql).get(...args); } catch (e) { console.error(sql, e); return null; } }
  function qRun(sql, ...args) { if (!db) return { changes: 0 }; try { return db.prepare(sql).run(...args); } catch (e) { console.error(sql, e); throw e; } }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function hoyStr() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function n2(v) { return (Math.round((parseFloat(v) || 0) * 100) / 100); }
  function money(v) { return (parseFloat(v) || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fechaLarga(f) {
    if (!f) return 'S/F';
    try {
      const [y, m, d] = String(f).split('-').map(Number);
      if (!y || !m || !d) return f;
      return `${pad2(d)}/${pad2(m)}/${y}`;
    } catch (e) { return f; }
  }
  function generarToken() { return generarRegLocal ? generarRegLocal() : Math.random().toString(36).slice(2, 12); }

  const ICONS = {
    building: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"></rect><line x1="9" y1="7" x2="9" y2="7.01"></line><line x1="15" y1="7" x2="15" y2="7.01"></line><line x1="9" y1="11" x2="9" y2="11.01"></line><line x1="15" y1="11" x2="15" y2="11.01"></line><line x1="9" y1="15" x2="9" y2="15.01"></line><line x1="15" y1="15" x2="15" y2="15.01"></line></svg>',

  // ACA ES LO NUEVO: Unificación usando la estructura de local_i_insumos_ordenes_Compra
  function obtenerProveedoresConsolidados() {
    const filas = q(`
      SELECT 
  COALESCE(p.proveedor, oc.prov_oc) AS proveedor,
  p.id AS cuenta_id,
  p.razon_social,
  p.cuit,
  p.localidad,
  p.telefono,
  p.habilitado,
  IFNULL((
    SELECT SUM(debe) 
    FROM local_ctb_movimientos_cc m 
    WHERE UPPER(TRIM(m.proveedor)) = UPPER(TRIM(COALESCE(p.proveedor, oc.prov_oc)))
  ), 0) AS total_debe,
  IFNULL((
    SELECT SUM(haber) 
    FROM local_ctb_movimientos_cc m 
    WHERE UPPER(TRIM(m.proveedor)) = UPPER(TRIM(COALESCE(p.proveedor, oc.prov_oc)))
  ), 0) AS total_haber,
  IFNULL(oc.cant_oc, 0) AS total_ordenes,
  IFNULL(oc.suma_oc, 0) AS total_monto_oc,
  CASE WHEN p.id IS NULL THEN 1 ELSE 0 END AS requiere_migracion
FROM local_proveedores_cuentas p
FULL OUTER JOIN (
  SELECT 
    UPPER(TRIM(proveedor)) AS prov_oc,
    COUNT(*) AS cant_oc,
    SUM(IFNULL(cantidad * imp_uni_usd * IFNULL(NULLIF(cotizacion, 0), 1), 0)) AS suma_oc
  FROM local_i_insumos_ordenes_Compra
  WHERE proveedor IS NOT NULL 
    AND TRIM(proveedor) != '' 
    AND UPPER(TRIM(proveedor)) NOT IN ('STOCK INICIAL')
  GROUP BY UPPER(TRIM(proveedor))
) oc ON UPPER(TRIM(p.proveedor)) = oc.prov_oc
WHERE COALESCE(p.proveedor, oc.prov_oc) IS NOT NULL 
  AND TRIM(COALESCE(p.proveedor, oc.prov_oc)) != ''
ORDER BY requiere_migracion DESC, proveedor COLLATE NOCASE ASC
    `);

    return filas.map(p => ({
      ...p,
      saldo: n2(p.total_debe) - n2(p.total_haber)
    }));
  }

  function obtenerMovimientosCC(proveedor) {
    return q(`SELECT * FROM local_ctb_movimientos_cc WHERE UPPER(TRIM(proveedor)) = UPPER(TRIM(?)) ORDER BY fecha ASC, id ASC`, proveedor);
  }

  function calcularMovimientosConSaldo(proveedor) {
    let saldo = 0;
    return obtenerMovimientosCC(proveedor).map(m => {
      saldo += (n2(m.debe) - n2(m.haber));
      return { ...m, saldo_corrido: saldo };
    });
  }

  async function guardarLibroEnDescargas(wb, nombreArchivo) {
    const os = require('os'); const pathMod = require('path'); const fs = require('fs');
    const carpetaDescargas = pathMod.join(os.homedir(), 'Downloads');
    try { if (!fs.existsSync(carpetaDescargas)) fs.mkdirSync(carpetaDescargas, { recursive: true }); } catch (e) {}
    const rutaFinal = pathMod.join(carpetaDescargas, nombreArchivo);
    await wb.xlsx.writeFile(rutaFinal);
    return rutaFinal;
  }
  function crearHojaEstilizada(wb, nombre, columnas, filas) {
    const ws = wb.addWorksheet(nombre.slice(0, 31));
    ws.columns = columnas;
    const headerRow = ws.getRow(1);
    headerRow.eachCell(cell => {
      cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E6B4C' } };
      cell.alignment = { vertical: 'middle', horizontal: 'center' };
    });
    headerRow.height = 22;
    filas.forEach(f => ws.addRow(f));
    return ws;
  }

  window.exportarCtaCteExcel = async function() {
    if (!isElectron) return lanzarNotificacionFlotante('La exportación solo está disponible en la app de escritorio.', 'warning');
    const movimientos = calcularMovimientosConSaldo(_proveedorActivo);
    if (movimientos.length === 0) return lanzarNotificacionFlotante('No hay movimientos para exportar.', 'warning');
    try {
      const ExcelJS = require('exceljs');
      const wb = new ExcelJS.Workbook();
      wb.creator = 'Gordon Gestión · Contable';
      crearHojaEstilizada(wb, 'Estado de Cuenta', [
        { header: 'FECHA', key: 'fecha', width: 12 },
        { header: 'TIPO', key: 'tipo', width: 16 },
        { header: 'COMPROBANTE', key: 'numero', width: 18 },
        { header: 'CONCEPTO', key: 'concepto', width: 32 },
        { header: 'VENCIMIENTO', key: 'venc', width: 12 },
        { header: 'DEBE', key: 'debe', width: 14 },
        { header: 'HABER', key: 'haber', width: 14 },
        { header: 'SALDO', key: 'saldo', width: 14 }
      ], movimientos.map(m => ({
        fecha: fechaLarga(m.fecha), tipo: (m.tipo || '').replace('_', ' '), numero: m.numero_comprobante || '',
        concepto: m.concepto || '', venc: m.fecha_vencimiento ? fechaLarga(m.fecha_vencimiento) : '',
        debe: Number(n2(m.debe)), haber: Number(n2(m.haber)), saldo: Number(n2(m.saldo_corrido))
      })));
      const nombre = `EstadoCuenta_${_proveedorActivo.replace(/[^a-zA-Z0-9]/g, '_')}_${hoyStr()}.xlsx`;
      await guardarLibroEnDescargas(wb, nombre);
      lanzarNotificacionFlotante(`¡Excel guardado en Descargas: ${nombre}!`, 'success');
    } catch (err) { console.error(err); lanzarNotificacionFlotante('Error al generar el Excel: ' + err.message, 'error'); }
  };

        const boxW = 70, boxH = 24, boxX = pageW - margen - boxW, boxY = topY - 1;

        doc.setFillColor(255, 255, 255);

        doc.text(`Movimientos: ${movimientos.length}`, boxX + 4, boxY + 21.9);

        doc.setDrawColor(30, 107, 76); doc.setLineWidth(0.6);
        doc.line(margen, ALTO_HEADER - 1, pageW - margen, ALTO_HEADER - 1);

        doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(30, 107, 76);
        doc.text(`PROVEEDOR: ${String(p ? p.proveedor : _proveedorActivo).toUpperCase()}${p && p.cuit ? '  ·  CUIT: ' + p.cuit : ''}`, margen, ALTO_HEADER + 4.5);
      }

      autoTable(doc, {
        startY: ALTO_HEADER + 8,
        margin: { left: margen, right: margen, top: ALTO_HEADER + 8, bottom: 22 },
        head: [['Fecha', 'Tipo', 'Comprobante', 'Concepto', 'Vencim.', 'Debe', 'Haber', 'Saldo']],
        body: movimientos.map(m => [
          fechaLarga(m.fecha),
          (m.tipo || '').replace('_', ' '),
          m.numero_comprobante || '—',
          `${m.concepto || ''}${m.medio_pago ? ' (' + m.medio_pago + ')' : ''}`,
          m.fecha_vencimiento ? fechaLarga(m.fecha_vencimiento) : '—',
          n2(m.debe) > 0 ? money(m.debe) : '—',
          n2(m.haber) > 0 ? money(m.haber) : '—',
          money(m.saldo_corrido)
        ]),
        headStyles: { fillColor: [30, 107, 76], textColor: 255, fontSize: 8, halign: 'center' },
        styles: { fontSize: 8, cellPadding: 2.6, lineColor: [225, 230, 226], lineWidth: 0.15 },
        alternateRowStyles: { fillColor: [244, 248, 246] },
        columnStyles: {
          5: { halign: 'right' }, 6: { halign: 'right' },
          7: { halign: 'right', fontStyle: 'bold', textColor: [198, 40, 40] }
        },
        theme: 'grid',
        didDrawPage: dibujarEncabezado
      });

      const totalPaginas = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPaginas; i++) {
        doc.setPage(i);
        doc.setDrawColor(210, 215, 211); doc.setLineWidth(0.2);
        doc.line(margen, pageH - 14, pageW - margen, pageH - 14);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.3); doc.setTextColor(150, 150, 150);
        doc.text(`Documento generado automáticamente por Gordon Gestión · Folio ${folio}`, margen, pageH - 9);
        doc.text(`Página ${i} de ${totalPaginas}`, pageW - margen, pageH - 9, { align: 'right' });
      }

      doc.setPage(totalPaginas);
      const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) || (ALTO_HEADER + 8);
      if (pageH - finalY > 26) {
        doc.setDrawColor(30, 107, 76); doc.setLineWidth(0.3);
        doc.line(pageW - margen - 80, finalY + 5, pageW - margen, finalY + 5);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(30, 107, 76);
        doc.text(`SALDO FINAL: $ ${money(saldoFinal)}`, pageW - margen, finalY + 11, { align: 'right' });
      }

      const carpetaDescargas = pathMod.join(os.homedir(), 'Downloads');
      if (!fs.existsSync(carpetaDescargas)) fs.mkdirSync(carpetaDescargas, { recursive: true });
      const nombre = `EstadoCuenta_${_proveedorActivo.replace(/[^a-zA-Z0-9]/g, '_')}_${hoyStr()}.pdf`;
      fs.writeFileSync(pathMod.join(carpetaDescargas, nombre), Buffer.from(doc.output('arraybuffer')));
      lanzarNotificacionFlotante(`¡PDF guardado en Descargas: ${nombre}!`, 'success');
    } catch (err) { console.error(err); lanzarNotificacionFlotante('Error al generar el PDF: ' + err.message, 'error'); }
  };

  // =========================================================================
  // Arranque
  // =========================================================================
  document.getElementById('btnVolver').addEventListener('click', () => {
    if (_vista === 'ficha') { window.volverAlListado(); return; }
    window.location.href = '../contable.html';
  });

  document.getElementById('topDateTime').textContent = new Date()
    .toLocaleDateString('es-AR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })
    .toUpperCase();
  document.getElementById('lblOperario').textContent = operarioName.toUpperCase();

  renderListado();
})();
</script>
</body>
</html>
